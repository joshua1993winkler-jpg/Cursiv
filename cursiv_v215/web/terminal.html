<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursiv — Eye of Horus Terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𓂀</text></svg>">

<!-- xterm.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:   #c9a741;
    --gold2:  #e8c96b;
    --bg:     #080c0c;
    --bg2:    #0f1a1a;
    --border: #1e3030;
    --text:   #d8d0c0;
    --muted:  #607070;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
    overflow: hidden;
  }

  /* ── Login overlay ────────────────────────────────────────────────── */
  #login-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 100;
  }

  .login-card {
    width: 380px;
    border: 1px solid var(--border);
    background: var(--bg2);
    padding: 40px 36px 36px;
    position: relative;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-logo .glyph {
    font-size: 2.8rem;
    display: block;
    margin-bottom: 6px;
    color: var(--gold);
  }

  .login-logo h1 {
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .login-logo p {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-group input:focus {
    border-color: var(--gold);
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 22px;
  }

  .btn {
    padding: 11px 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn:hover { border-color: var(--gold); color: var(--gold); }

  .btn.primary {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn.primary:hover {
    background: var(--gold);
    color: var(--bg);
  }

  #login-error {
    margin-top: 14px;
    font-size: 0.78rem;
    color: #ff5555;
    text-align: center;
    min-height: 1.2em;
  }

  /* ── Main layout ────────────────────────────────────────────────────── */
  #app {
    display: none;
    flex-direction: column;
    height: 100%;
  }

  #app.visible { display: flex; }

  /* ── Top bar ────────────────────────────────────────────────────────── */
  #topbar {
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 36px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    gap: 12px;
  }

  #topbar .brand {
    color: var(--gold);
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 400;
  }

  #topbar .edition-badge {
    font-size: 0.65rem;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 1px 7px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #topbar .spacer { flex: 1; }

  #topbar .user-label {
    font-size: 0.72rem;
    color: var(--muted);
  }

  #conn-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
  }

  #conn-dot.connected   { background: #50fa7b; }
  #conn-dot.connecting  { background: var(--gold); animation: pulse 1s infinite; }
  #conn-dot.error       { background: #ff5555; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  #download-btn {
    font-size: 0.7rem;
    padding: 3px 12px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: inherit;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    text-transform: uppercase;
  }

  #download-btn:hover {
    background: var(--gold);
    color: var(--bg);
  }

  /* ── Terminal container ──────────────────────────────────────────────── */
  #terminal-wrap {
    flex: 1;
    overflow: hidden;
    padding: 8px 4px 4px 8px;
  }

  #terminal {
    width: 100%;
    height: 100%;
  }

  /* xterm overrides */
  .xterm { height: 100%; }
  .xterm-viewport { overflow-y: hidden !important; }

  /* ── Mobile warning ──────────────────────────────────────────────────── */
  #mobile-warn {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    z-index: 200;
  }

  #mobile-warn p { color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
  #mobile-warn a { color: var(--gold); }

  @media (max-width: 600px) {
    #mobile-warn { display: flex; flex-direction: column; gap: 20px; }
  }
</style>
</head>
<body>

<!-- Mobile fallback -->
<div id="mobile-warn">
  <div style="font-size:2rem;color:var(--gold)">𓂀</div>
  <p>
    Cursiv Terminal works best on a desktop browser.<br>
    On mobile, <a href="https://cursiv.winklers-llc.com">download the desktop app</a>
    for the full experience.
  </p>
</div>



<!-- Main app -->
<div id="app">
  <div id="topbar">
    <span class="brand">𓂀 Cursiv</span>
    <span class="edition-badge" id="edition-badge">Eye of Horus • Web</span>
    <div class="spacer"></div>
    <span class="user-label" id="user-label"></span>
    <span id="conn-dot" class="connecting" title="Connecting..."></span>
    <a id="letters-btn" href="/letters" style="display:none;margin-right:8px;font-size:.68rem;padding:2px 9px;border:1px solid #c9a741;color:#c9a741;text-decoration:none;letter-spacing:.06em;">BABEL LETTERS</a>
    <a id="vision-btn" href="/vision" style="margin-right:8px;font-size:.68rem;padding:2px 9px;border:1px solid #3a4a4a;color:#a8b0b8;text-decoration:none;letter-spacing:.06em;">VISION</a>
    <a id="download-btn" href="https://cursiv.winklers-llc.com" target="_blank">
      Download Desktop
    </a>
  </div>
  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>
</div>

<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
// Override these via window.CURSIV_API_BASE / window.CURSIV_WS_BASE if the
// backend is on a different domain (e.g. Railway deployment).
const API_BASE = window.CURSIV_API_BASE ||
  (location.protocol === 'https:' ? 'https://' : 'http://') + location.host;
const WS_BASE  = window.CURSIV_WS_BASE  ||
  (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

// ── State ─────────────────────────────────────────────────────────────────────
// Public standalone - no login or token
let token    = '';
let username = 'public';
let ws       = null;
let term     = null;
let fitAddon = null;

let inputBuffer   = '';
let history       = [];
let historyPos    = -1;
let isProcessing  = false;
let reconnectCount = 0;
const MAX_RECONNECT = 5;

// ── Helpers ───────────────────────────────────────────────────────────────────
function setError(msg) {
  document.getElementById('login-error').textContent = msg;
}

function setLoading(btn, loading) {
  btn.disabled = loading;
  btn.textContent = loading
    ? (btn.id === 'signin-btn' ? 'Signing in...' : 'Registering...')
    : (btn.id === 'signin-btn' ? 'Sign In' : 'Register');
}

async function apiPost(path, body) {
  const resp = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

// ── No login required - public standalone terminal ────────────────────────────
// Use secret codes like "babel I am Keiarra Winkler born 09/12/1995" for letters.

// ── Terminal setup ────────────────────────────────────────────────────────────
function initTerminal() {
  term = new Terminal({
    theme: {
      background:   '#080c0c',
      foreground:   '#d8d0c0',
      cursor:       '#c9a741',
      cursorAccent: '#080c0c',
      black:        '#080c0c',
      red:          '#ff5555',
      green:        '#50fa7b',
      yellow:       '#c9a741',
      blue:         '#6272a4',
      magenta:      '#bd93f9',
      cyan:         '#8be9fd',
      white:        '#d8d0c0',
      brightBlack:  '#607070',
      brightYellow: '#e8c96b',
    },
    fontFamily: '"Cascadia Code", "Fira Code", Consolas, monospace',
    fontSize:   14,
    lineHeight: 1.45,
    cursorBlink: true,
    cursorStyle: 'bar',
    scrollback:  5000,
    convertEol:  false,
    allowTransparency: false,
  });

  fitAddon = new FitAddon.FitAddon();
  const linksAddon = new WebLinksAddon.WebLinksAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(linksAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  window.addEventListener('resize', () => fitAddon.fit());

  term.onKey(handleKey);
  term.focus();
}

function handleKey({ key, domEvent }) {
  if (isProcessing) {
    // Ctrl+C breaks out
    if (domEvent.ctrlKey && domEvent.keyCode === 67) {
      ws && ws.send('\x03');
      term.write('^C\r\n');
      isProcessing = false;
      showPrompt();
    }
    return;
  }

  const printable = !domEvent.altKey && !domEvent.ctrlKey && !domEvent.metaKey;

  if (printable && key && key.length === 1) {
    inputBuffer += key;
    term.write(key);
    return;
  }

  switch (domEvent.keyCode) {
    case 13: // Enter
      term.write('\r\n');
      submitInput();
      break;

    case 8: // Backspace
      if (inputBuffer.length > 0) {
        inputBuffer = inputBuffer.slice(0, -1);
        term.write('\b \b');
      }
      break;

    case 38: // Arrow Up — history
      if (historyPos < history.length - 1) {
        historyPos++;
        replaceInput(history[historyPos]);
      }
      break;

    case 40: // Arrow Down — history
      if (historyPos > 0) {
        historyPos--;
        replaceInput(history[historyPos]);
      } else if (historyPos === 0) {
        historyPos = -1;
        replaceInput('');
      }
      break;

    case 67: // C
      if (domEvent.ctrlKey) {
        term.write('^C\r\n');
        inputBuffer = '';
        historyPos  = -1;
        showPrompt();
      }
      break;

    case 76: // L
      if (domEvent.ctrlKey) {
        term.write('\x1b[2J\x1b[H');
        showPrompt();
      }
      break;
  }
}

function replaceInput(newText) {
  term.write('\r\x1b[K');
  showPromptNoNL();
  inputBuffer = newText;
  term.write(newText);
}

function submitInput() {
  const cmd = inputBuffer.trim();
  inputBuffer = '';
  historyPos  = -1;

  if (cmd) {
    history.unshift(cmd);
    if (history.length > 80) history.pop();
    sendMessage(cmd);
  } else {
    showPrompt();
  }
}

const PROMPT_STR = '\x1b[33m\u{13080}\x1b[0m  ';

function showPromptNoNL() { term.write(PROMPT_STR); }
function showPrompt()     { term.write('\r\n' + PROMPT_STR); }

// ── WebSocket ─────────────────────────────────────────────────────────────────
const DONE_MARKER = '\x00DONE\x00';
const ERR_MARKER  = '\x00ERR\x00';

function setDot(cls) {
  const dot = document.getElementById('conn-dot');
  dot.className = cls;
  dot.title = cls === 'connected' ? 'Connected'
            : cls === 'connecting' ? 'Connecting...'
            : 'Disconnected';
}

function connectWS() {
  setDot('connecting');

  const url = `${WS_BASE}/ws/chat?token=${encodeURIComponent(token)}`;
  ws = new WebSocket(url);

  ws.onmessage = (e) => {
    if (e.data === DONE_MARKER) {
      isProcessing = false;
      showPrompt();
    } else if (e.data.startsWith(ERR_MARKER)) {
      const msg = e.data.slice(ERR_MARKER.length);
      term.write(`\x1b[31m${msg}\x1b[0m`);
      isProcessing = false;
      showPrompt();
    } else {
      term.write(e.data);
    }
  };

  ws.onerror = () => { setDot('error'); };

  ws.onopen = () => {
    setDot('connected');
    reconnectCount = 0;
  };

  ws.onclose = (e) => {
    setDot('error');
    if (e.code === 4001) {
      localStorage.removeItem('cursiv_token');
      localStorage.removeItem('cursiv_user');
      location.reload();
      return;
    }
    reconnectCount++;
    if (reconnectCount > MAX_RECONNECT) {
      term.write('\r\n\x1b[31m  Server unreachable. Refresh to try again.\x1b[0m\r\n');
      return;
    }
    const delay = Math.min(1000 * reconnectCount, 8000);
    term.write(`\r\n\x1b[90m  Connection lost. Reconnecting in ${delay/1000}s...\x1b[0m\r\n`);
    setTimeout(connectWS, delay);
  };
}

function sendMessage(msg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    term.write('\x1b[31m  Not connected. Please wait...\x1b[0m');
    showPrompt();
    return;
  }
  isProcessing = true;
  ws.send(msg);
}

// ── Show terminal ─────────────────────────────────────────────────────────────
function showTerminal() {
  document.getElementById('login-overlay').style.display = 'none';
  const app = document.getElementById('app');
  app.classList.add('visible');
  document.getElementById('user-label').textContent = username;

  // Special + master access
  fetch(API_BASE + '/api/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(r => r.json()).then(me => {
    if (!me) return;
    const badge = document.getElementById('edition-badge');
    if (me.is_master && badge) {
      badge.textContent = 'MASTER • Eye of Horus • Web';
      badge.style.borderColor = '#c9a741';
      badge.style.color = '#c9a741';
    } else if (me.is_special && badge) {
      badge.textContent = 'Special Access • Eye of Horus • Web';
    }
    if (me.is_special) {
      const b = document.getElementById('letters-btn');
      if (b) {
        b.style.display = 'inline-block';
        if (me.is_master) b.textContent = 'LETTERS (MASTER)';
      }
    }
  }).catch(() => {});

  if (!term) initTerminal();
  connectWS();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
// Public standalone - no login. Secret codes for family letters.
const appEl = document.getElementById('app');
if (appEl) appEl.style.display = 'flex';

const loginOverlay = document.getElementById('login-overlay');
if (loginOverlay) loginOverlay.style.display = 'none';

if (!term) initTerminal();
connectWS();

// ── Embedded mode for the main Eye page (whatever it takes to make the terminal work) ──
(function handleEmbedded() {
  const isEmbedded = location.search.includes('embedded') || window.self !== window.top;
  if (!isEmbedded) return;

  // Hide all top chrome / nav / labels so only the pure xterm shows inside the iframe
  const idsToHide = [
    'topbar', 'header', 'nav', 'app-header',
    'vision-btn', 'download-btn', 'letters-btn',
    'user-label', 'edition-badge', 'conn-dot',
    'login-overlay'
  ];
  idsToHide.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });

  // Also hide by common classes/selectors that may be in the top chrome
  document.querySelectorAll('header, nav, .topbar, .header, .nav, [class*="top"], [class*="header"]').forEach(el => {
    if (el) el.style.display = 'none';
  });

  // Make terminal wrap take every pixel
  const wrap = document.getElementById('terminal-wrap');
  if (wrap) {
    wrap.style.height = '100%';
    wrap.style.margin = '0';
    wrap.style.padding = '0';
    wrap.style.border = '0';
    wrap.style.boxShadow = 'none';
  }

  // Clean body for seamless iframe
  document.body.style.margin = '0';
  document.body.style.padding = '0';
  document.body.style.overflow = 'hidden';
  document.body.style.background = '#080c0c';

  // Ensure the terminal itself fills
  setTimeout(() => {
    if (fitAddon) fitAddon.fit();
    if (term) term.focus();
  }, 50);
})();
</script>
</body>
</html>
